<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GamerPointMC • Panel Login</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070b12;color:#edf2ff;font-family:Inter,system-ui,Arial}.box{width:min(420px,92vw);background:#0f1725;border:1px solid #26334a;border-radius:20px;padding:24px;box-shadow:0 20px 60px #0007}h1{margin:0 0 6px}.muted{color:#8996ab;font-size:13px;margin-bottom:20px}input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid #34445d;background:#090f1a;color:#fff;font-size:16px}button{width:100%;margin-top:12px;padding:12px;border:1px solid #34445d;background:#17243a;color:#fff;border-radius:11px;font-size:16px;cursor:pointer}.err{display:none;color:#ff7180;font-size:13px;margin-top:10px}</style></head><body><form class="box" id="form"><h1>GamerPointMC</h1><div class="muted">24/7 Bot Panel • Railway</div><input id="password" type="password" placeholder="Panel password" autocomplete="current-password" autofocus><button>Open Panel</button><div class="err" id="err"></div></form>
<script>form.onsubmit=async e=>{e.preventDefault();err.style.display='none';const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})});const x=await r.json();if(x.ok)location.href='/';else{err.textContent=x.error||'Login failed';err.style.display='block'}};</script></body></html>
