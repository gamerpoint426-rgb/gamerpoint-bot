<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GamerPointMC • 24/7 Bot Panel</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#070b12;color:#edf2ff}
.wrap{max-width:1150px;margin:auto;padding:22px 16px}.top{margin-bottom:18px}h1{margin:0;font-size:28px}.muted{color:#8793a9;font-size:13px}
.card{background:#0f1725;border:1px solid #26334a;border-radius:18px;padding:17px;margin-bottom:16px;box-shadow:0 15px 45px #0005}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px}.bot{background:#0b1220;border:1px solid #26334a;border-radius:15px;padding:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.name{font-weight:750}.status{margin-top:8px;color:#8996ab;font-size:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#66738a;margin-right:7px}.on{background:#35dc84}
.switch{width:62px;height:34px;position:relative;flex:0 0 auto}.switch input{display:none}.slider{position:absolute;inset:0;border-radius:30px;background:#344157;cursor:pointer;transition:.2s}
.slider:before{content:"";position:absolute;width:26px;height:26px;left:4px;top:4px;background:white;border-radius:50%;transition:.2s}
.switch input:checked+.slider{background:#18b966}.switch input:checked+.slider:before{transform:translateX(28px)}
.consoleHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.buttons{display:flex;gap:8px;flex-wrap:wrap}
button{border:1px solid #34445d;background:#17243a;color:#eef4ff;border-radius:10px;padding:9px 12px;cursor:pointer}
button:hover{background:#21314b}button.danger{background:#331721}
pre{margin:12px 0 0;height:390px;overflow:auto;background:#05080d;border:1px solid #202b3c;border-radius:12px;padding:13px;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.stat{background:#0f1725;border:1px solid #26334a;border-radius:15px;padding:14px}.num{font-size:20px;font-weight:750;margin-top:4px}
.notice{padding:10px 12px;border-radius:10px;background:#111c2d;border:1px solid #263a57;margin-bottom:14px;font-size:13px}
@media(max-width:650px){.stats{grid-template-columns:1fr}.top{display:block}}
</style></head>
<body><div class="wrap">
<div class="top"><h1>GamerPointMC • 24/7 Bot Panel</h1><div class="muted">Direct Railway panel • Velocity + LimboAuth</div></div>
<div class="notice">Minecraft target: <b id="host">loading…</b> • Each bot reconnects automatically after disconnect.</div>
<div class="stats">
<div class="stat"><div class="muted">Bots running</div><div class="num" id="count">0 / 4</div></div>
<div class="stat"><div class="muted">Login delay</div><div class="num">1.5s</div></div>
<div class="stat"><div class="muted">Server route delay</div><div class="num">30s</div></div>
</div>
<div class="card"><h2>Bot Controls</h2><div class="grid" id="bots"></div></div>
<div class="card"><div class="consoleHead"><h2>Live Console</h2><div class="buttons"><button onclick="copyLog()">Copy Log</button><button onclick="clearLog()">Clear</button><button class="danger" onclick="stopAll()">Stop All</button></div></div><pre id="console"></pre></div>
</div>
<script>
const C=document.getElementById("console"); const ids=["1","2","3","4"]; let state={};
function add(s){C.textContent+=s+"\n";C.scrollTop=C.scrollHeight}
function render(){const el=document.getElementById("bots");el.innerHTML="";let n=0;for(const id of ids){const b=state[id]||{running:false};if(b.running)n++;el.innerHTML+=`<div class="bot"><div class="row"><div><div class="name"><span class="dot ${b.running?"on":""}"></span>${b.name||"Bot "+id}</div><div class="status">Target: ${b.target||"unknown"} • ${b.running?"RUNNING":"STOPPED"}</div></div><label class="switch"><input type="checkbox" ${b.running?"checked":""} onchange="toggle('${id}',this.checked)"><span class="slider"></span></label></div></div>`}document.getElementById("count").textContent=`${n} / 4`}
async function api(url,method="GET"){const r=await fetch(url,{method,headers:{"Content-Type":"application/json"}});if(r.status===401){location.href='/';return {ok:false,error:'Session expired'}}return r.json()}
async function toggle(id,on){add(`[panel] ${on?"START":"STOP"} requested for bot ${id}`);const x=await api(`/api/bots/${id}/${on?"start":"stop"}`,"POST");if(!x.ok)add(`[error] ${x.error}`);await load()}
async function stopAll(){for(const id of ids)if(state[id]?.running){const x=await api(`/api/bots/${id}/stop`,"POST");if(!x.ok)add(`[error] Bot ${id}: ${x.error}`)}await load()}
async function load(){const x=await api("/api/state");if(x.ok){state=x.bots;render()}const c=await api("/api/config");if(c.ok)document.getElementById("host").textContent=`${c.host}:${c.port}`}
async function copyLog(){await navigator.clipboard.writeText(C.textContent);add("[panel] Log copied")};function clearLog(){C.textContent=""}
function connectWS(){const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws");ws.onopen=()=>add("[panel] Connected to live panel");ws.onclose=()=>{add("[panel] Live connection closed; reconnecting...");setTimeout(connectWS,3000)};ws.onmessage=e=>{const x=JSON.parse(e.data);if(x.type==="log")add(x.line);if(x.type==="state"){state=x.bots;render()}}}
connectWS();load();setInterval(load,5000);
</script></body></html>
