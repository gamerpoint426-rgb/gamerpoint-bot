<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GamerPointMC • Bot Control</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#070b12;color:#edf2ff}.wrap{max-width:1200px;margin:auto;padding:20px 14px}h1,h2,h3{margin:0}.muted{color:#8793a9;font-size:13px}.top{margin-bottom:16px}.notice{padding:11px 13px;border-radius:12px;background:#111c2d;border:1px solid #263a57;margin:12px 0;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat,.card{background:#0f1725;border:1px solid #26334a;border-radius:16px;padding:14px}.num{font-size:19px;font-weight:750;margin-top:4px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.bot{background:#0b1220;border:1px solid #26334a;border-radius:15px;padding:15px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.name{font-weight:750;font-size:16px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#66738a;margin-right:7px}.on{background:#35dc84}.status{margin-top:7px;color:#a1acc0;font-size:13px}.switch{width:60px;height:33px;position:relative;flex:0 0 auto}.switch input{display:none}.slider{position:absolute;inset:0;border-radius:30px;background:#344157;cursor:pointer}.slider:before{content:"";position:absolute;width:25px;height:25px;left:4px;top:4px;background:#fff;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:#18b966}.switch input:checked+.slider:before{transform:translateX(27px)}button,select,input{font:inherit}button,select,input[type=password],input[type=number],input[type=text]{border:1px solid #34445d;background:#17243a;color:#eef4ff;border-radius:10px;padding:9px 10px}button{cursor:pointer}button:hover{background:#21314b}.danger{background:#331721!important}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.settings{display:none;margin-top:13px;padding-top:13px;border-top:1px solid #26334a}.settings.open{display:block}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:#8793a9}.wide{grid-column:1/-1}.hint{font-size:11px;color:#68758a}.serverNow{margin-top:10px;padding:8px 10px;border-radius:9px;background:#101a2a;font-size:12px}.consoleWrap{margin-top:14px}.consoleHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.consoleTabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.tab{white-space:nowrap}.tab.active{background:#31517b}.console{display:none}.console.active{display:block}pre{margin:0;height:360px;overflow:auto;background:#05080d;border:1px solid #202b3c;border-radius:12px;padding:13px;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}.buttons{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><div class="wrap">
<div class="top"><h1>GamerPointMC • 24/7 Bot Control</h1><div class="muted">Direct Railway panel • no external API required</div></div>
<div class="notice">Proxy: <b id="host">loading…</b> • Minecraft version: <b>1.21.11</b></div>
<div class="stats"><div class="stat"><div class="muted">Bots running</div><div class="num" id="count">0 / 4</div></div><div class="stat"><div class="muted">Selected bot</div><div class="num" id="selected">Lobby</div></div><div class="stat"><div class="muted">Auto reconnect</div><div class="num">Enabled</div></div><div class="stat"><div class="muted">Panel</div><div class="num">Direct</div></div></div>
<div class="card"><div class="row"><h2>Bot Controls</h2><button onclick="stopAll()" class="danger">Stop All</button></div><div class="grid" id="bots"></div></div>
<div class="card consoleWrap"><div class="consoleHead"><h2>Per-Bot Console</h2><div class="buttons"><button onclick="copyCurrent()">Copy</button><button onclick="clearCurrent()">Clear</button></div></div><div class="consoleTabs" id="tabs"></div><div id="consoles"></div></div>
</div>
<script>
const ids=["1","2","3","4"], labels={"1":"Lobby","2":"Survival","3":"MiniGame","4":"OneBlock"};let state={},selected="1",serverOptions=["lobby","survival","minigame","oneblock"];
const logs={"1":[],"2":[],"3":[],"4":[]};
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const openIds=ids.filter(id=>document.getElementById("settings-"+id)?.classList.contains("open"));const focused=document.activeElement?.id||null;const formValues={};for(const id of openIds){for(const k of ["target","pass","disc","recon","route","login"]){const e=document.getElementById(`${k}-${id}`);if(e)formValues[`${k}-${id}`]=e.value}}let el=document.getElementById("bots"),n=0;el.innerHTML="";for(const id of ids){const b=state[id]||{};if(b.running)n++;el.innerHTML+=`<div class="bot"><div class="row"><div><div class="name"><span class="dot ${b.running?'on':''}"></span>${esc(b.name||labels[id])}</div><div class="status">Target: <b>${esc(b.target||'-')}</b> • ${b.running?'RUNNING':'STOPPED'}</div></div><label class="switch"><input type="checkbox" ${b.running?'checked':''} onchange="toggle('${id}',this.checked)"><span class="slider"></span></label></div><div class="serverNow">Currently detected server: <b>${esc(b.actualServer||'unknown')}</b></div><div class="actions"><button onclick="openSettings('${id}')">⚙ Settings</button><button onclick="selectConsole('${id}')">▣ Console</button></div><div class="settings" id="settings-${id}"><div class="form"><div class="field"><label>Target server</label><select id="target-${id}">${serverOptions.map(x=>`<option value="${esc(x)}" ${x===b.target?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Bot password</label><input id="pass-${id}" type="text" value="${esc(b.password||'')}" autocomplete="off"></div><div class="field"><label>Disconnect interval (minutes)</label><input id="disc-${id}" type="number" min="0" step="0.1" value="${(Number(b.disconnectInterval||0)/60000).toFixed(1)}"><div class="hint">0 = never force a periodic disconnect.</div></div><div class="field"><label>Reconnect interval (seconds)</label><input id="recon-${id}" type="number" min="1" step="1" value="${Math.round((b.reconnectDelay||5000)/1000)}"></div><div class="field"><label>Route delay (seconds)</label><input id="route-${id}" type="number" min="0" step="1" value="${Math.round((b.routeDelay||30000)/1000)}"></div><div class="field"><label>Login delay (seconds)</label><input id="login-${id}" type="number" min="0" step="0.1" value="${((b.loginDelay||1500)/1000).toFixed(1)}"></div><div class="field wide"><button onclick="saveSettings('${id}')">Save & Restart Bot</button></div></div></div></div>`}document.getElementById("count").textContent=`${n} / 4`;document.getElementById("selected").textContent=labels[selected];for(const id of openIds){document.getElementById("settings-"+id)?.classList.add("open")}for(const [key,value] of Object.entries(formValues)){const e=document.getElementById(key);if(e)e.value=value}if(focused){const e=document.getElementById(focused);if(e){e.focus({preventScroll:true});try{if(typeof e.setSelectionRange==='function'){const pos=Math.min(e.value.length,e.selectionStart??e.value.length);e.setSelectionRange(pos,pos)}}catch{}}}renderTabs()}
function renderTabs(){const t=document.getElementById("tabs"),c=document.getElementById("consoles");t.innerHTML=ids.map(id=>`<button class="tab ${id===selected?'active':''}" onclick="selectConsole('${id}')">${labels[id]}</button>`).join("");c.innerHTML=ids.map(id=>`<pre class="console ${id===selected?'active':''}" id="console-${id}">${esc(logs[id].join('\n'))}</pre>`).join("");}
function appendLog(id,line){logs[id].push(line);if(logs[id].length>1500)logs[id].shift();const el=document.getElementById('console-'+id);if(el){el.textContent=logs[id].join('\n');el.scrollTop=el.scrollHeight}}
function selectConsole(id){selected=id;render();}
function openSettings(id){document.getElementById('settings-'+id)?.classList.toggle('open')}
async function api(url,method='GET',body){const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(r.status===401){location.href='/';return {ok:false,error:'Session expired'}}return r.json()}
async function toggle(id,on){appendLog(id,`[panel] ${on?'START':'STOP'} requested`);const x=await api(`/api/bots/${id}/${on?'start':'stop'}`,'POST');if(!x.ok)appendLog(id,`[error] ${x.error}`);await load()}
async function stopAll(){for(const id of ids)if(state[id]?.running){const x=await api(`/api/bots/${id}/stop`,'POST');if(!x.ok)appendLog(id,`[error] ${x.error}`)}await load()}
async function saveSettings(id){const target=document.getElementById('target-'+id).value;const body={target,password:document.getElementById('pass-'+id).value,disconnectInterval:Math.round(Number(document.getElementById('disc-'+id).value||0)*60000),reconnectDelay:Math.round(Number(document.getElementById('recon-'+id).value||5)*1000),routeDelay:Math.round(Number(document.getElementById('route-'+id).value||30)*1000),loginDelay:Math.round(Number(document.getElementById('login-'+id).value||1.5)*1000)};const x=await api(`/api/bots/${id}/config`,'POST',body);if(!x.ok)return appendLog(id,`[error] ${x.error}`);appendLog(id,'[panel] Settings saved. Bot restarting...');await load()}
async function load(){const x=await api('/api/state');if(x.ok){state=x.bots;render()}const c=await api('/api/config');if(c.ok){serverOptions=c.serverOptions||serverOptions;document.getElementById('host').textContent=`${c.host}:${c.port}`}}
async function loadLogs(){for(const id of ids){const x=await api('/api/logs/'+id);if(x.ok)logs[id]=x.log||[]}render()}
async function copyCurrent(){await navigator.clipboard.writeText(logs[selected].join('\n'));appendLog(selected,'[panel] Console copied')}
function clearCurrent(){logs[selected]=[];render()}
function connectWS(){const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws.onopen=()=>appendLog(selected,'[panel] Live connection connected');ws.onclose=()=>{appendLog(selected,'[panel] Live connection closed; retrying...');setTimeout(connectWS,3000)};ws.onmessage=e=>{const x=JSON.parse(e.data);if(x.type==='log')appendLog(x.id,x.line);if(x.type==='state'){state=x.bots;render()}}}
connectWS();loadLogs();load();setInterval(load,5000);
</script></body></html>
